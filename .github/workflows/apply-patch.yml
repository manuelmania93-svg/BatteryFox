name: apply-patch
on:
  workflow_dispatch:
    inputs:
      issue:
        required: true
      branch:
        required: true
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch and apply patch
        run: |
          curl -fsSL "https://api.github.com/repos/${{ github.repository }}/issues/${{ inputs.issue }}/comments?per_page=100" -o /tmp/c.json
          jq -r '.[].body' /tmp/c.json | grep -v '^\(BEGIN\|END\)' | tr -d '\r\n ' | base64 -d > /tmp/p.patch
          sha256sum /tmp/p.patch
          git config user.name "manuelmania93-svg"
          git config user.email "manuelmania93@gmail.com"
          git checkout -B "${{ inputs.branch }}" 327803be6250977c92d83710e13ce27c0ab67974
          git am /tmp/p.patch
          git push -f -u origin "${{ inputs.branch }}"
