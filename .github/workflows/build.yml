name: Build Battery Fox APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Build Debug APK
      run: ./gradlew testDebugUnitTest assembleDebug assembleRelease --stacktrace

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: BatteryFox-debug
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Upload unsigned minified release (CI only)
      uses: actions/upload-artifact@v4
      with:
        name: BatteryFox-release-unsigned
        path: app/build/outputs/apk/release/*-unsigned.apk
        if-no-files-found: error
