name: Signed release build

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: Monotonically increasing Android version code (greater than 1)
        required: true
        type: string
      version_name:
        description: Semantic version, e.g. 1.1.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  signed-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - name: Validate version and signing inputs
        env:
          VERSION_CODE: ${{ inputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
          KEYSTORE_BASE64: ${{ secrets.BATTERYFOX_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.BATTERYFOX_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BATTERYFOX_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BATTERYFOX_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [[ "$VERSION_CODE" =~ ^[0-9]+$ ]] && (( VERSION_CODE > 1 ))
          [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]
          for value in "$KEYSTORE_BASE64" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD"; do
            if [[ -z "$value" ]]; then echo "Configure the four BATTERYFOX signing secrets in the release environment."; exit 1; fi
          done
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/batteryfox-release.jks"
      - name: Test and build signed minified APK
        env:
          BATTERYFOX_KEYSTORE_PATH: ${{ runner.temp }}/batteryfox-release.jks
          BATTERYFOX_STORE_PASSWORD: ${{ secrets.BATTERYFOX_STORE_PASSWORD }}
          BATTERYFOX_KEY_ALIAS: ${{ secrets.BATTERYFOX_KEY_ALIAS }}
          BATTERYFOX_KEY_PASSWORD: ${{ secrets.BATTERYFOX_KEY_PASSWORD }}
          VERSION_CODE: ${{ inputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          ./gradlew testDebugUnitTest assembleRelease -PrequireReleaseSigning=true \
            "-PreleaseVersionCode=$VERSION_CODE" "-PreleaseVersionName=$VERSION_NAME" --stacktrace
      - name: Verify APK signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BatteryFox-signed-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Remove private key
        if: always()
        run: rm -f "$RUNNER_TEMP/batteryfox-release.jks"
